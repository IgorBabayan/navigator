name: CI

# Validation only: never publishes anything. See docs/RELEASE.md for the release pipeline.
on:
  pull_request:
    branches: [development, release]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded CI runs of the same PR/branch can be cancelled safely (CI never publishes).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  quality:
    name: Format and analyzers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Navigator.slnx
      - name: Verify formatting
        run: dotnet format Navigator.slnx --verify-no-changes --no-restore --severity warn
      - name: Build with analyzers (warnings are errors in CI)
        run: dotnet build Navigator.slnx --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - name: Validate localization files
        shell: bash
        run: |
          for f in src/Navigator.Presentation/Localization/Strings/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

  test:
    name: Build and test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Navigator.slnx
      - name: Build
        run: dotnet build Navigator.slnx --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/Navigator.UnitTests/Navigator.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests
        run: dotnet test tests/Navigator.IntegrationTests/Navigator.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14

  publish-smoke:
    # Cross-platform compatibility: every shipping runtime identifier must publish self-contained.
    name: Publish ${{ matrix.rid }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish
        shell: bash
        run: dotnet publish src/Navigator.App/Navigator.App.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -o "publish/${{ matrix.rid }}"
      - name: Check output
        shell: bash
        run: |
          exe="publish/${{ matrix.rid }}/Navigator"
          [[ "${{ matrix.rid }}" == win-* ]] && exe="$exe.exe"
          test -f "$exe" || { echo "::error::$exe was not produced"; exit 1; }
